UI vesamenu.c32
DEFAULT install
TIMEOUT 100
MENU TITLE UltraVioleta OS - Menú de arranque
MENU BACKGROUND splash.png

LABEL install
  MENU LABEL Instalar UltraVioleta OS
  KERNEL /install/gtk/vmlinuz
  APPEND initrd=/install/gtk/initrd.gz priority=medium ---

LABEL install-text
  MENU LABEL Instalar UltraVioleta OS (modo texto)
  KERNEL /install/vmlinuz
  APPEND initrd=/install/initrd.gz priority=medium vga=normal ---

LABEL live
  MENU LABEL Probar UltraVioleta OS (modo live, sin instalar)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash video=1024x768-24
