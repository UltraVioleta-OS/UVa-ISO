insmod png
background_image /boot/grub/splash.png
set default=0
set timeout=10

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Instalar UltraVioleta OS" {
    linux /install/gtk/vmlinuz video=vesa:ywrap,mtrr vga=788 priority=medium ---
    initrd /install/gtk/initrd.gz
}

menuentry "Instalar UltraVioleta OS (modo texto)" {
    linux /install/vmlinuz priority=medium vga=normal ---
    initrd /install/initrd.gz
}

menuentry "Probar UltraVioleta OS (modo live, sin instalar)" {
    linux /live/vmlinuz boot=live components quiet splash video=1024x768-24
    initrd /live/initrd.img
}
